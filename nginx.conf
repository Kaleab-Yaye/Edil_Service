events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 20M;

    server {
        listen 80;

        # Serve static uploaded images publicly to frontend
        location /static/ {
            alias /var/www/static_store/;
            expires 30d;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Secure PUT endpoint for direct image upload
        location ~ ^/upload/(?<file_id>[a-zA-Z0-9_-]+\.(jpg|jpeg|png|webp))$ {
            # Handle CORS preflight OPTIONS request directly in Nginx
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

            # Add CORS headers to PUT response
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:r;

            # Subrequest to Spring Boot Caffeine check before accepting upload
            auth_request /auth-check-internal;

            alias /var/www/static_store/$file_id;
        }

        location /upload/receipt/ {

        if ($request_method ~ ^(PUT|OPTIONS)$ ) {
                    return 405;
                }

        if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        add_header 'Content-Length' 0;
                        add_header 'Content-Type' 'text/plain; charset=utf-8';
                        return 204;
                    }

        # Add CORS headers to PUT response
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r



        auth_request /receipt-upload-auth-check

        alias /receipt_store/uploads/

        }


        location

        # Subrequest endpoint to Spring Boot Caffeine upload verification
        location = /auth-check-internal {
            internal;
            resolver 127.0.0.11 valid=30s;
            set $backend "http://host.docker.internal:8080";
            proxy_pass $backend/api/uploads/auth-check?fileId=$file_id;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }


        location = /receipt-upload-auth-check {

        resolver 127.0.0.11 valid=30s;
        set $backend "http://host.docker.internal:8080";
        proxy_pass $backend/api/uploads/auth-check
        proxy_pass_request_body off
        proxy_set_header Content-Length ""
        proxy_set_header X-Original-URI $request_uri

        }
    }
}

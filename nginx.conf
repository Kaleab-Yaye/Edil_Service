events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 20M;

    server {
        listen 80;

        # Serve static uploaded images publicly to frontend
        location /static/ {
            alias /var/www/static_store/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Secure PUT endpoint for direct image upload (image files only)
        location ~ ^/upload/(?<file_id>[a-zA-Z0-9_-]+\.(jpg|jpeg|png|webp))$ {
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:r;

            # Subrequest to Spring Boot Caffeine check before accepting upload
            auth_request /auth-check-internal;

            alias /var/www/static_store/$file_id;
        }

        # Subrequest endpoint to Spring Boot Caffeine upload verification
        location = /auth-check-internal {
            internal;
            proxy_pass http://host.docker.internal:8080/api/uploads/auth-check?fileId=$file_id;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }
    }
}

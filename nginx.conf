events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 5M;

    server {
        listen 80;



        location / {
        root /var/www/edil/dist;
        index index.html;

        try_files $uri $uri  /index.html;

        }


        location /assets/ { #optimization.
        root /var/www/edil/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

        location /api/ {
            proxy_pass http://edil:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        }


        location /static/ {
            alias /var/www/static_store/;
            expires 30d;
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Secure PUT endpoint for direct image upload
        location ~ ^/upload/(?<file_id>[a-zA-Z0-9_-]+\.(jpg|jpeg|png|webp))$ {
            # Handle CORS preflight OPTIONS request directly in Nginx
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                return 204;
            }

            # Add CORS headers to PUT response
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:r;

            # Subrequest to Spring Boot Caffeine check before accepting upload
            auth_request /auth-check-internal;

            alias /var/www/static_store/$file_id;
        }

        location /upload/receipt/ {

        if ($request_method !~ ^(PUT|OPTIONS)$ ) {
                    return 405;
                }

        if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                        add_header 'Access-Control-Max-Age' 86400;
                        add_header 'Content-Length' 0;
                        add_header 'Content-Type' 'text/plain; charset=utf-8';
                        return 204;
                    }

        # Add CORS headers to PUT response
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;



        auth_request /receipt-upload-auth-check;

        alias /receipt_store/uploads/;

        }


    location  /download/report/pdf/ {

    set $saved_key $arg_key;

            if ($request_method !~ ^(GET|OPTIONS)$ ) {
                                return 405;
                            }

           if ($request_method = 'OPTIONS') {
                                   add_header 'Access-Control-Allow-Origin' '*' always;
                                   add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
                                   add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                                   add_header 'Access-Control-Max-Age' 86400;
                                   add_header 'Content-Length' 0;
                                   add_header 'Content-Type' 'text/plain; charset=utf-8';
                                   return 204;
                               }

                   # Add CORS headers to PUT response
                   add_header 'Access-Control-Allow-Origin' '*' always;
                   add_header 'Access-Control-Allow-Methods' 'PUT, OPTIONS' always;
                   add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

            auth_request /auth-check-for-download-pdf;


            alias /report/store/pdf/;

            }


            #auth requests>>>



        # Subrequest endpoint to Spring Boot Caffeine upload verification
    location  /auth-check-internal {
            internal;

            set $backend "http://edil:8080";
            proxy_pass $backend/api/uploads/auth-check?fileId=$file_id;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }


    location = /receipt-upload-auth-check {


        set $backend "http://edil:8080";
        proxy_pass $backend/api/v1/receipt/check/upload/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;


    }


    location = /auth-check-for-download-pdf {
    internal;
    set $backend "http://edil:8080";
    proxy_pass $backend/api/v1/download/report/internal/auth?key=$saved_key;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;

    }

    }
}
